name: Refresh CAP status

on:
  schedule:
    # Every 20 min, roughly 8am-9pm NZ time (times are UTC)
    - cron: "*/20 0-8,19-23 * * *"
  workflow_dispatch:        # adds a "Run workflow" button for an instant refresh

permissions:
  contents: write

concurrency: cap-status

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock jsdom@24
      - run: node cap-status/build_cap_status.js cap-status/template.html cap-status/index.html
      - name: Save the refreshed page
        run: |
          git config user.name "cap-status-bot"
          git config user.email "actions@users.noreply.github.com"
          git add cap-status/index.html
          git diff --cached --quiet || git commit -m "Refresh CAP status"
          git push
